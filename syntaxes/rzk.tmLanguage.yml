$schema: https://raw.githubusercontent.com/martinring/tmlanguage/master/tmlanguage.json
comment: This TextMate Grammar file has been generated from a YAML file.
name: rzk-1
patterns:
  - match: ^(#lang)\s+((?![-?!.])[^.\\;,#"\]\[)(}{><|\s]*)(?=$|[.\\;,#"\]\[)(}{><|\s])\s*$
    captures:
      "1":
        name: keyword.control.lang.rzk
      "2":
        name: entity.name.label.rzk
  - match: ^(#check|#compute(-whnf|-nf)?|#set-option|#unset-option)(?=$|[.\\;,#"\]\[)(}{><|\s-])
    captures:
      "1":
        name: keyword.control.rzk
  - match: ^(#section|#end)(\s+(?![-?!.])[^.\\;,#"\]\[)(}{><|\s]*)?(?=$|[.\\;,#"\]\[)(}{><|\s])
    captures:
      "1":
        name: keyword.control.rzk
      "2":
        name: support.constant.property-value.rzk
  - match: ^(#assume|#variable|#variables)\s+((?![-?!.])[^.\\;,#"\]\[)(}{><|\s:]*)(?=$|[.\\;,#"\]\[)(}{><|\s])
    captures:
      "1":
        name: meta.preprocessor.rzk
      "2":
        name: variable.rzk
  - match: ^(#def|#define|#postulate)\s+((?![-?!.])[^.\\;,#"\]\[)(}{><|\s]*)(?=$|[.\\;,#"\]\[)(}{><|\s])(\s+(uses)\s+\(((?![-?!.])[^.\\;,#"\]\[)(}{><|]*)\))?
    captures:
      "1":
        name: meta.preprocessor.rzk
      "2":
        name: entity.name.function.rzk
      "4":
        name: support.constant.property-value.rzk
      "5":
        name: variable.parameter.rzk
  - match: ^(#data)\s+((?![-?!.])[^.\\;,#"\]\[)(}{><|\s]*)(?=$|[.\\;,#"\]\[)(}{><|\s])(\s+(uses)\s+\(((?![-?!.])[^.\\;,#"\]\[)(}{><|]*)\))?
    captures:
      "1":
        name: meta.preprocessor.rzk
      "2":
        name: entity.name.type.rzk
      "4":
        name: support.constant.property-value.rzk
      "5":
        name: variable.parameter.rzk
  - include: "#strings"
  - include: "#terms"
repository:
  terms:
    patterns:
      - include: "#index-types"
      - include: "#builtins"
      - include: "#params"
      - include: "#comments"
      - include: "#holes"
      - include: "#ext-types"
      - include: "#lambda-abstractions"
      - include: "#operators"
  builtins:
    patterns:
      - name: support.type.rzk
        match: (?<=^|[.\\;,#"\]\[)(}{><|\s])(CUBE|TOPE|U|𝒰)(?=$|[.\\;,#"\]\[)(}{><|\s])
      - name: entity.name.type.rzk
        match: (?<=^|[.\\;,#"\]\[)(}{><|\s])(1|2|Unit|II|𝕀|Sigma|∑|Σ)(?=$|[.\\;,#"\]\[)(}{><|\s])
      - name: string.regexp
        match: (===|<=|\\/|/\\|≡|≤|∨|∧)
      - name: support.constant.rzk
        match: (⊤|⊥|\*(_1|₁)|⋆)|(?<=^|[.\\;,#"\]\[)(}{><|\s])(0(_2|₂|_I|ᵢ)|1(_2|₂|_I|ᵢ)|TOP|BOT)(?=$|[.\\;,#"\]\[)(}{><|\s])
      - name: support.function.rzk
        match: (?<=^|[.\\;,#"\]\[)(}{><|\s])(recOR|recBOT|idJ|refl|first|second|π₁|π₂|unit|sup|inf|invᵒᵖ|uninvᵒᵖ|flipᵒᵖ|unflipᵒᵖ|inv_op|uninv_op|flip_op|unflip_op)((?=$|[.\\;,#"\]\[)(}{><|\s])|(?=_{))
      - name: keyword.control.rzk
        match: (?<=^|[.\\;,#"\]\[)(}{><|\s])(match|into)(?=$|[.\\;,#"\]\[)(}{><|\s])
      # The re-ascription clauses of a #data body. Matched as two-word
      # sequences, as `let mod` is below: `compute` on its own is a plausible
      # identifier, and only the pair is a keyword.
      - name: keyword.control.rzk
        match: (?<=^|[.\\;,#"\]\[)(}{><|\s])(eliminate|compute)\s+(with)(?=$|[.\\;,#"\]\[)(}{><|\s])
      - name: keyword.control.as.rzk
        match: (?<=^|[.\\;,#"\]\[)(}{><|\s])as(?=$|[.\\;,#"\]\[)(}{><|\s])
      - name: keyword.control.rzk
        match: (?<=^|[.\\;,#"\]\[)(}{><|\s])(let)\s+(mod)(?=$|[.\\;,#"\]\[)(}{><|\s])
      - name: keyword.control.rzk
        match: (?<=^|[.\\;,#"\]\[)(}{><|\s])let(?=$|[.\\;,#"\]\[)(}{><|\s])
      - name: keyword.control.rzk
        match: (?<=^|[.\\;,#"\]\[)(}{><|\s])in(?=$|[.\\;,#"\]\[)(}{><|\s])
      - name: support.function.rzk
        match: (?<=^|[.\\;,#"\]\[)(}{><|\s])mod(?=$|[.\\;,#"\]\[)(}{><|\s])
      - name: invalid.rzk
        match: \$extract\$
      - name: entity.name.tag.rzk
        match: :(♭|ᵒᵖ|♯|_b|_op|_#|_id)(?=$|[.\\;,#"\]\[)(}{><|\s])
      - name: entity.name.tag.rzk
        match: (♭|ᵒᵖ|♯|_b|_op|_#|_id)
  param-identifiers:
    # Match one identifier at a time. The previous form
    #   ((?![-?!.])[^…]*)(\s*(?![-?!.])[^…]*)*
    # could match a zero-length span, which collapses any enclosing begin/end
    # region (e.g. lambda-abstractions); see #74.
    patterns:
      - match: (?![-?!.])[^.\\;,#"\]\[)(}{><|\s]+
        name: variable.parameter.rzk
  param-topes:
    patterns:
      - match: (\|)([^)}]*)
        captures:
          "1":
            name: keyword.operator.param-topes.rzk
          "2":
            name: string.interpolated.rzk
            patterns:
              - include: "#builtins"
  ext-type-topes:
    patterns:
      []
      # - match: ([^|]*)(\|->|↦)
      #   captures:
      #     "1":
      #       name: string.interpolated.rzk
      #       patterns:
      #         - include: "#builtins"
      #     "2":
      #       name: keyword.operator.mapsto.rzk
  ext-types:
    patterns:
      - begin: \[
        end: \]
        patterns:
          - include: "#ext-type-topes"
          - include: "#terms"
  index-types:
    patterns:
      - begin: _{
        end: "}"
        name: comment.block.rzk
        patterns:
          - include: "#builtins"
          - include: "#index-types"
          - include: "#comments"
  params:
    patterns:
      # The identifier part must not cross an unbalanced closing paren:
      # with a plain [^{:]+ a non-parameter group such as `(suc n)` before
      # a later colon opened a parameter region spanning to the next line
      # (see the vhead fixture). Balanced paren groups of any depth are
      # allowed for pair patterns, `( ( (a , b) , c) : A)`, via Oniguruma
      # subexpression recursion (\g<2> re-enters the paren-group
      # alternative).
      - begin: \(\s*((?:[^{:()]|(\((?:[^()]|\g<2>)*\)))+)\s*(:)(?=$|[.\\;,#"\]\[)(}{><|\s])
        end: \)
        beginCaptures:
          "1":
            patterns:
              - include: "#param-identifiers"
              - include: "#builtins"
              - include: "#comments"
          "3":
            name: keyword.operator.colon.params.rzk
        patterns:
          - include: "#param-topes"
          - include: "#terms"
  lambda-abstractions:
    patterns:
      - begin: (?<=^|[.\\;,#"\]\[)(}{><|\s])(\\)(?=$|[.\\;,#"\]\[)(}{><|\s])
        beginCaptures:
          "1":
            name: keyword.operator.lambda.slash.rzk
        end: (?<=^|[.\\;,#"\]\[)(}{><|\s])(->|→)
        endCaptures:
          "0":
            name: keyword.operator.lambda.to.rzk
        patterns:
          - include: "#params"
          - include: "#param-identifiers"
          - include: "#comments"
  comments:
    patterns:
      - name: comment.block.rzk
        begin: \{-
        end: -\}
      - name: comment.line.rzk
        match: (?<=^|[.\\;,#"\]\[)(}{><|\s])--.*$
  holes:
    patterns:
      - name: constant.language.placeholder.rzk
        match: \?
  strings:
    name: string.quoted.double.rzk
    begin: '"'
    end: '"'
    patterns:
      - name: constant.character.escape.rzk
        match: \\.
  operators:
    patterns:
      - name: keyword.operator.branch.rzk
        match: (?<=^|[.\\;,#"\]\[)(}{><|\s])(=>|⇒)(?=$|[.\\;,#"\]\[)(}{><|\s])
      - name: keyword.operator.lattice.rzk
        match: (⊔|⊓)
      - name: keyword.operator.rzk
        match: (?<=^|[.\\;,#"\]\[)(}{><|\s])(:=|->|:|→)(?=$|[.\\;,#"\]\[)(}{><|\s])
      - name: punctuation.equals.rzk
        match: (?<=^|[.\\;,#"\]\[)(}{><|\s])=(?=$|[.\\;,#"\]\[)(}{><|\s])
      - name: punctuation.comma.rzk
        match: ","
      - name: punctuation.multiplication.rzk
        match: (?<=^|[.\\;,#"\]\[)(}{><|\s])(\*|×)(?=$|[.\\;,#"\]\[)(}{><|\s])
      - name: keyword.operator.rzk
        match: (?<!(?<=^|[.\\;,#"\]\[)(}{><|\s])-)>|[\\|]
scopeName: source.rzk
